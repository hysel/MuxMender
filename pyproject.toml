[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muxmender"
version = "0.1.0"
description = "Safely analyze and optimize media libraries for efficient direct playback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MuxMender contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
muxmender = "muxmender:cli"
muxmender-dashboard = "dashboard:main"
muxmender-webui = "webui:main"
muxmender-plan = "library_planner:main"

[tool.setuptools]
py-modules = ["muxmender", "native_pipeline", "runtime_support", "streaming_pipeline", "job_tracking", "dashboard", "run_logged", "dv_full_file", "dv_preservation_test", "media_preflight", "library_planner", "workflow_worker", "webui", "webui_page", "audio_validation", "revalidate_output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
