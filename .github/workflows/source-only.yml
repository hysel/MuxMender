name: Source-only repository
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest deploy.check_source_tree
