name: Build candidate on GitHub
on:
  workflow_dispatch:
    inputs:
      materials_release:
        description: Draft release containing build-notices.tar
        required: true
      materials_sha256:
        description: SHA256 of build-notices.tar
        required: true
      runtime_generation:
        description: Increment to rebuild unchanged dependencies for security updates
        default: '1'
        required: true
permissions:
  contents: read
concurrency:
  group: hosted-candidate
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    # Build-only work needs no publication approval. The publish job retains
    # the protected container-release environment and registry permission.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Draft release assets require push access to read. No registry permission.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch and verify required notices
        env:
          GH_TOKEN: ${{ github.token }}
          MATERIALS_RELEASE: ${{ inputs.materials_release }}
          MATERIALS_SHA256: ${{ inputs.materials_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATERIALS_RELEASE" =~ ^[0-9]{8}-v[0-9]+$ ]]
          [[ "$MATERIALS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh release download "$MATERIALS_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern build-notices.tar --dir "$RUNNER_TEMP/notices-download"
          python3 -B deploy/prepare_build_notices.py --archive "$RUNNER_TEMP/notices-download/build-notices.tar" --sha256 "$MATERIALS_SHA256" --destination "$RUNNER_TEMP/notices-verified"
          cp -a "$RUNNER_TEMP/notices-verified/public-materials" public-materials
      - name: Restore exact dependency runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/runtime-cache
          key: runtime-linux-amd64-${{ inputs.runtime_generation }}-${{ hashFiles('deploy/truenas/Dockerfile.public', 'deploy/truenas/Dockerfile.hdr-gpu-reader', 'deploy/truenas/build_ffmpeg9.sh', 'deploy/truenas/requirements-av1-runtime.txt', 'deploy/truenas/ffmpeg9-source.sha256', 'deploy/install_fel_runtime.py', 'deploy/patch_cuda_ffprobe.py', 'deploy/prepare_hosted_build.py', 'python/dv_fel_runtime.py') }}
      - name: Fetch checksum-pinned upstream inputs
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python3 -B deploy/prepare_hosted_build.py
      - name: Build FFmpeg 9 GPU reader from source
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          docker build --output type=local,dest=reader-output reader-build
          mkdir -p vendor/gpu-reader
          cp reader-output/bin/ffprobe-cuda vendor/gpu-reader/ffprobe-cuda
      - name: Build and retain dependency runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --target runtime -f deploy/truenas/Dockerfile.public -t muxmender-runtime:ci .
          python3 -B deploy/runtime_cache.py save muxmender-runtime:ci "$RUNNER_TEMP/runtime-cache"
      - name: Load and verify cached runtime
        shell: bash
        run: python3 -B deploy/runtime_cache.py load muxmender-runtime:ci "$RUNNER_TEMP/runtime-cache"
      - name: Build candidate image on GitHub
        run: |
          docker build --build-arg RUNTIME_IMAGE=muxmender-runtime:ci --label "org.opencontainers.image.revision=$GITHUB_SHA" -f deploy/truenas/Dockerfile.public -t muxmender-candidate:ci .
      - name: Audit runtime and run CPU-compatible image checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/work"
          sudo chown 568:568 "$RUNNER_TEMP/work"
          docker image inspect muxmender-candidate:ci --format '{{.Id}}' > "$RUNNER_TEMP/receipts/image-id.txt"
          docker run --rm --network none --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" --entrypoint python3 muxmender-candidate:ci -B /qualification/deploy/audit_image_runtime.py --require-redistributable --require-ffmpeg9 > "$RUNNER_TEMP/receipts/runtime.json"
          docker run --rm --network none --entrypoint python3 muxmender-candidate:ci -B -c 'import app_service, auto_optimize, av; assert av.__version__ == "19.0.0"'
          echo 'GitHub build, runtime audit and import checks complete. Full regression suite is retained outside this repository and must be run before release approval. No GPU qualification or public-image approval claimed. No registry push or stable promotion performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export the exact candidate image
        shell: bash
        run: |
          set -euo pipefail
          python3 -B deploy/export_candidate.py muxmender-candidate:ci "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/receipts/runtime.json" "$RUNNER_TEMP/candidate/runtime.json"
      - name: Retain candidate for qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-image-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Report retained package
        run: echo 'Candidate image retained for 14 days with image ID, source revision, SHA256 and runtime audit. This is not a qualified release; stable is unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hosted-build-receipts
          path: ${{ runner.temp }}/receipts/
          retention-days: 14
